<text x="453" y="143" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#526b62">FastAPI, Pydantic</text>
<text x="453" y="165" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#526b62">Validate graph, versions and edits</text>
