<text x="853" y="143" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#526b62">SQLite: tasks, versions, results, logs</text>
<text x="853" y="165" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#526b62">SSE: send events to the browser</text>
