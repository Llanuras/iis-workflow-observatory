<text x="53" y="115" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#173f39">Browser interface</text>
<text x="53" y="143" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#526b62">React, React Flow, Tailwind</text>
<text x="53" y="165" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#526b62">Tasks, graph, details and report</text>
