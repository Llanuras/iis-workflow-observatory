<text x="53" y="353" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#526b62">Planner, Researcher, Reviewer, Writer</text>
<text x="53" y="375" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#526b62">Shared DeepSeek; separate calls</text>
