<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#247264"/></marker></defs>
<rect width="1200" height="240" rx="16" fill="#f7faf6"/>
<text x="30" y="39" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="600" fill="#173f39">From a question to an inspectable research report</text>
<rect x="25" y="70" width="265" height="130" rx="10" fill="white" stroke="#c6d8cd" stroke-width="1.4"/>
<text x="43" y="100" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#173f39">01  Plan</text>
<text x="43" y="128" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#526b62">Ask a question; inspect the plan</text>
<text x="43" y="150" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#526b62">Review steps, roles and</text>
<text x="43" y="172" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#526b62">dependencies</text>
<path d="M290 135L317 135" stroke="#247264" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
<rect x="320" y="70" width="265" height="130" rx="10" fill="white" stroke="#c6d8cd" stroke-width="1.4"/>
<text x="338" y="100" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#173f39">02  Execute</text>
<text x="338" y="128" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#526b62">Live search, reading and analysis</text>
<text x="338" y="150" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#526b62">Inspect statuses, tool calls and</text>
<text x="338" y="172" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#526b62">sources</text>
<path d="M585 135L612 135" stroke="#247264" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
<rect x="615" y="70" width="265" height="130" rx="10" fill="white" stroke="#c6d8cd" stroke-width="1.4"/>
<text x="633" y="100" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#173f39">03  Supervise</text>
<text x="633" y="128" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#526b62">Inspect adaptation or propose edits</text>
<text x="633" y="150" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#526b62">Preview effects; apply a new version</text>
<path d="M880 135L907 135" stroke="#247264" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
<rect x="910" y="70" width="265" height="130" rx="10" fill="white" stroke="#c6d8cd" stroke-width="1.4"/>
<text x="928" y="100" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="600" fill="#173f39">04  Export</text>
<text x="928" y="128" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#526b62">Read the report and inspect sources</text>
<text x="928" y="150" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#526b62">Download report and execution</text>
<text x="928" y="172" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#526b62">records</text>
</svg>